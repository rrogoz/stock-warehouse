[project]
name = "stock-warehouse"
version = "0.1.0"
description = "Agentic delivery demonstrator: a medallion data warehouse for public market data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.4",
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.4",
    "exchange-calendars>=4.13.3",
    "holidays>=0.108",
    "jsonschema>=4.26.0",
    "moto[s3]>=5.2.5",
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "sqlfluff>=3.2",
    "sqlfluff-templater-dbt>=4.5.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine", "src/connectors"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, N naming, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["engine", "connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.sqlfluff.core]
dialect = "duckdb"
# The dbt templater compiles each model with dbt (lint target in dbt/profiles.yml, SW-19).
templater = "dbt"
max_line_length = 100

[tool.sqlfluff.templater.dbt]
project_dir = "dbt"
profiles_dir = "dbt"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.references.keywords]
# `source` is a standard business column (docs/standards/naming.md), also a SQL keyword.
ignore_words = "source"

[[tool.mypy.overrides]]
# exchange_calendars ships no type hints.
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true
