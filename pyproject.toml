[project]
name = "stock-warehouse"
version = "0.1.0"
description = "Agentic delivery demonstrator: a medallion data warehouse for public market data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "sqlfluff>=3.2",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine", "src/connectors"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, N naming, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["engine", "connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.sqlfluff.core]
dialect = "duckdb"
# Switch to the dbt templater once the dbt project lands (M1).
templater = "jinja"
max_line_length = 100

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"
