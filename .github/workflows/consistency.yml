# Daily consistency check (ADR-010): Jira agrees with GitHub and the last weekday's
# PROD run succeeded (ADR-007). A failure emails Rafal. Script: .github/scripts/check_consistency.py
name: consistency

on:
  schedule:
    - cron: "0 6 * * *" # every morning, after the weekday evening PROD run
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

jobs:
  consistency:
    name: Jira and GitHub agree, PROD ran
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_consistency.py
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
