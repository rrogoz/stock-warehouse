# Generated by `python -m engine.dbt_models` from config/entities/dim_instrument.yaml; do not edit.
version: 2
models:
- name: dim_instrument
  description: 'Every version of every instrument''s attributes, as the instrument register records them (`reference/instrument_register.yaml`, `versions`). Lineage: register, step `reference`, staging model `stg_reference__instrument_versions`. Prices look instruments up here. Grain: one version of an instrument''s attributes, per instrument and valid-from date.'
  config:
    materialized: incremental
    incremental_strategy: append
    on_schema_change: fail
    contract:
      enforced: true
    meta:
      key:
      - instrument_code
      - valid_from_date
      values:
      - current_symbol
      - asset_class
      - exchange
      - quote_ccy
  data_tests:
  - unique_key:
      arguments:
        columns:
        - instrument_code
        - valid_from_date
        - known_at
  columns:
  - name: instrument_code
    data_type: varchar
    description: Permanent code of the instrument, for example `FX.EURPLN` (ADR-004). Business key.
    data_tests:
    - not_null
  - name: valid_from_date
    data_type: date
    description: First date this version holds. The business date of the entity (SCD2).
    data_tests:
    - not_null
  - name: current_symbol
    data_type: varchar
    description: Symbol the instrument is shown under from `valid_from_date` on; FX, base and quote currency without separator, for example `EURPLN`.
    data_tests:
    - not_null
  - name: asset_class
    data_type: varchar
    description: Asset class of the instrument.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - fx
  - name: exchange
    data_type: varchar
    description: MIC of the listing exchange, for example `XWAR`. Null for FX pairs.
  - name: quote_ccy
    data_type: varchar
    description: Currency of the instrument's prices, ISO 4217, for example `PLN`.
    data_tests:
    - not_null
  - name: known_at
    data_type: timestamp with time zone
    description: Midnight UTC of the version's `recorded_date` in the register. Reference data has no bronze, so this replaces the fetch time.
    data_tests:
    - not_null
  - name: run_id
    data_type: varchar
    description: Id of the run that inserted the row (`ops_run_log.run_id`).
    data_tests:
    - not_null
  - name: record_hash
    data_type: varchar
    description: md5 of the value fields (`current_symbol`, `asset_class`, `exchange`, `quote_ccy`) as text, null as `\N`, joined by `chr(31)`. A version is inserted only when it differs from the previous one.
    data_tests:
    - not_null
